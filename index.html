<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel U - Pro IA</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            color-scheme: dark; 
            --bg-dark: #020617;
            --card-bg: rgba(30, 41, 59, 0.6);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --secondary: #8b5cf6;
            --secondary-hover: #7c3aed;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --ai-color: #06b6d4;
            --gradient-text: linear-gradient(135deg, #38bdf8, #818cf8);
            --gradient-bg: radial-gradient(circle at top right, #1e293b, var(--bg-dark));
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

       body { 
            background: var(--gradient-bg); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center;    
            justify-content: flex-start;
            padding: 20px 15px 40px 15px; 
            overflow-x: hidden;
        }

        #login-view {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; max-width: 400px; text-align: center; gap: 24px;
            margin-top: 25vh; 
        }
        #login-view h1 { font-size: 2.2rem; background: var(--gradient-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; letter-spacing: -0.5px;}
        
        .btn-google {
            background: #fff; color: #0f172a; border: none; padding: 14px 24px; border-radius: 12px;
            font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.3s ease;
            display: flex; justify-content: center; align-items: center; gap: 12px; width: 100%; 
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.1);
        }
        .btn-google:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(255, 255, 255, 0.2); }

        .dashboard-wrapper {
            width: 100%; max-width: 600px; display: none; flex-direction: column; gap: 20px;
        }

        .header { 
            display: flex; align-items: center; gap: 15px; margin-bottom: 10px; 
            justify-content: space-between; position: relative;
            padding: 15px 20px; background: rgba(15, 23, 42, 0.4); 
            border-radius: 20px; border: 1px solid var(--border-light);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .profile-section { display: flex; align-items: center; gap: 15px; }
        .avatar {
            width: 48px; height: 48px; background: var(--gradient-text); border-radius: 12px;
            display: flex; align-items: center; justify-content: center; color: #fff;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .header-text { display: flex; flex-direction: column; gap: 2px; }
        .header-text h1 { font-size: 1.15rem; font-weight: 700; color: #f8fafc; letter-spacing: -0.3px;}
        .header-text p { font-size: 0.8rem; color: #38bdf8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}
        
        .menu-container { position: relative; }
        .btn-menu {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-light); color: #fff;
            width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; font-size: 1.2rem;
        }
        .btn-menu:hover { background: rgba(255, 255, 255, 0.1); transform: scale(1.05); }
        
        .dropdown-menu {
            position: absolute; top: 55px; right: 0; background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-light); border-radius: 16px; padding: 8px;
            width: 220px; display: none; flex-direction: column; gap: 4px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); z-index: 100;
        }
        .dropdown-menu.active { display: flex; animation: dropIn 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes dropIn { from { opacity: 0; transform: translateY(-15px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        .dropdown-item {
            padding: 12px 15px; border-radius: 10px; cursor: pointer; display: flex; align-items: center;
            gap: 12px; font-size: 0.95rem; font-weight: 500; transition: 0.2s; color: var(--text-muted);
        }
        .dropdown-item:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
        .dropdown-item.active-item { background: rgba(59, 130, 246, 0.1); color: var(--primary); font-weight: 600;}
        .dropdown-item.danger:hover { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        
        .card {
            background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-light); border-radius: 20px; padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); width: 100%; 
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 25px;
        }
        .card:hover { transform: translateY(-2px); box-shadow: 0 15px 45px rgba(0,0,0,0.4); }
        .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; letter-spacing: -0.3px;}

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .form-grid.full { grid-template-columns: 1fr; }
        .form-grid.time-grid { grid-template-columns: 1.2fr 1fr 1fr; }
        @media (max-width: 480px) { .form-grid, .form-grid.time-grid { grid-template-columns: 1fr !important; } }

        .form-group { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .form-group label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .form-control {
            width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border-light);
            padding: 14px 16px; border-radius: 12px; color: #fff; font-size: 0.95rem; 
            transition: all 0.3s ease;
        }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); background: rgba(0, 0, 0, 0.4); }
        select.form-control { 
            cursor: pointer; appearance: none; 
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); 
            background-repeat: no-repeat; background-position: right 14px top 50%; background-size: 12px auto; 
            padding-right: 40px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;
        }

        .custom-file-upload {
            display: flex; align-items: center; gap: 10px; padding: 13px 16px;
            background: rgba(0, 0, 0, 0.2); border: 1px dashed rgba(148, 163, 184, 0.3);
            border-radius: 12px; color: var(--text-muted); cursor: pointer; transition: all 0.3s;
            font-size: 0.9rem; overflow: hidden; white-space: nowrap; height: 100%;
        }
        .custom-file-upload:hover { border-color: var(--primary); color: #fff; background: rgba(59, 130, 246, 0.05);}
        .custom-file-upload input[type="file"] { display: none; }
        .custom-file-upload i { color: var(--primary); font-size: 1.1rem; }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #2563eb); color: white;
            border: none; padding: 16px; border-radius: 14px; font-weight: 600; font-size: 1rem;
            cursor: pointer; transition: all 0.3s ease; width: 100%;
            display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 15px;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(59, 130, 246, 0.4); }
        .btn-secondary { background: linear-gradient(135deg, var(--secondary), #6d28d9); box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3); }
        .btn-secondary:hover { box-shadow: 0 12px 25px rgba(139, 92, 246, 0.4); }
        .btn-ai { background: linear-gradient(135deg, var(--ai-color), #3b82f6); box-shadow: 0 8px 20px rgba(6, 182, 212, 0.3); }
        .btn-ai:hover { box-shadow: 0 12px 25px rgba(6, 182, 212, 0.4); }
        .btn-ai:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .list-item {
            background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-light); padding: 16px;
            border-radius: 16px; margin-bottom: 12px; display: flex; justify-content: space-between;
            align-items: center; transition: all 0.3s ease; gap: 15px;
        }
        .list-item:hover { transform: translateY(-3px) scale(1.01); border-color: rgba(255, 255, 255, 0.15); background: rgba(30, 41, 59, 0.8); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        
        .task-item { border-left: 4px solid var(--secondary); align-items: center; }
        .task-item.urgent { border-left-color: var(--danger); background: linear-gradient(90deg, rgba(239, 68, 68, 0.08), rgba(15, 23, 42, 0.6) 40%); }
        .task-item.completing { transform: scale(0.9); opacity: 0; background: rgba(16, 185, 129, 0.2); border-color: var(--success); }
        
        .task-tag { 
            font-size: 0.7rem; background: rgba(139, 92, 246, 0.15); padding: 5px 12px; 
            border-radius: 20px; font-weight: 600; color: #c4b5fd; 
            display: inline-flex; align-items: center; gap: 5px; border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .item-img-box {
            width: 50px; height: 50px; border-radius: 14px; background: rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            flex-shrink: 0; color: var(--text-muted); font-size: 1.3rem; border: 1px solid var(--border-light);
        }
        .item-img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .item-info { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
        .item-info h3 { font-size: 1.05rem; font-weight: 600; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin:0;}
        .item-info p { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; margin:0; font-weight: 500;}
        
        .actions { display: flex; gap: 8px; flex-shrink: 0; align-items: center;}
        
        .btn-icon {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-light); color: var(--text-muted);
            width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s; font-size: 1rem;
        }
        .btn-icon:hover { color: #fff; }
        .btn-icon.play { color: var(--primary); }
        .btn-icon.play:hover { background: rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.4); }
        .btn-icon.edit { color: var(--warning); }
        .btn-icon.edit:hover { background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.4); }
        .btn-icon.success { color: var(--success); }
        .btn-icon.success:hover { background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.4); }
        .btn-icon.delete:hover { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4); color: var(--danger); }

        .empty-state { text-align: center; padding: 20px; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .empty-state i { font-size: 2.5rem; opacity: 0.3; }
        .empty-state p { font-size: 0.95rem; font-weight: 500; }
    </style>
</head>
<body>
    <!-- PANTALLA DE INICIO DE SESIÓN -->
    <div id="login-view">
        <i class="fa-solid fa-graduation-cap" style="font-size: 4.5rem; color: #3b82f6; filter: drop-shadow(0 0 20px rgba(59,130,246,0.4));"></i>
        <h1>Panel Universitario</h1>
        <button class="btn-google" onclick="loginWithGoogle()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="22" alt="Google">
            Iniciar sesión con Google
        </button>
    </div>
    
    <!-- PANEL PRINCIPAL -->
    <div class="dashboard-wrapper" id="dashboard-view">
        
        <div class="header">
            <div class="profile-section">
                <div class="avatar" id="profileAvatar"></div>
                <div class="header-text">
                    <h1 id="userName">Cargando...</h1>
                    <p id="vistaActualTexto">Agenda de Clases</p>
                </div>
            </div>
            
            <div class="menu-container">
                <button class="btn-menu" onclick="toggleMenu()">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </button>
                <div id="dropdownMenu" class="dropdown-menu">
                    <div class="dropdown-item active-item" id="menu-clases" onclick="cambiarVista('clases')">
                        <i class="fa-solid fa-book" style="width: 20px; text-align: center;"></i> Mis Clases
                    </div>
                    <div class="dropdown-item" id="menu-tareas" onclick="cambiarVista('tareas')">
                        <i class="fa-solid fa-clipboard-list" style="width: 20px; text-align: center;"></i> Mis Tareas
                    </div>
                    <div class="dropdown-item" id="menu-audio" onclick="cambiarVista('audio')">
                        <i class="fa-solid fa-microphone-lines" style="width: 20px; text-align: center;"></i> Clases en Audio (IA)
                    </div>
                    <hr style="border: 0; height: 1px; background: var(--border-light); margin: 4px 0;">
                    <div class="dropdown-item danger" onclick="logout()">
                        <i class="fa-solid fa-arrow-right-from-bracket" style="width: 20px; text-align: center;"></i> Cerrar sesión
                    </div>
                </div>
            </div>
        </div>

        <!-- =================== SECCIÓN DE CLASES =================== -->
        <div id="vista-clases">
            <div class="card">
                <div class="card-title" style="color: #38bdf8;"><i class="fa-solid fa-bolt"></i> Programar Materia</div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Materia</label>
                        <input type="text" id="className" class="form-control" placeholder="Ej. Contabilidad I">
                    </div>
                    <div class="form-group">
                        <label>Portada (Opcional)</label>
                        <label class="custom-file-upload">
                            <i class="fa-solid fa-cloud-arrow-up"></i><span id="fileNameDisplay" style="text-overflow: ellipsis; overflow: hidden;">Adjuntar imagen...</span>
                            <input type="file" id="classImage" accept="image/*">
                        </label>
                    </div>
                </div>
                
                <div class="form-grid full" style="margin-bottom: 16px;">
                    <div class="form-group">
                        <label>Enlace de la sesión (Meet / Zoom)</label>
                        <input type="url" id="classLink" class="form-control" placeholder="https://...">
                    </div>
                </div>

                <div class="form-grid time-grid">
                    <div class="form-group">
                        <label>Día</label>
                        <select id="classDay" class="form-control">
                            <option value="1">Lunes</option><option value="2">Martes</option>
                            <option value="3">Miércoles</option><option value="4">Jueves</option>
                            <option value="5">Viernes</option><option value="6">Sábado</option><option value="7">Domingo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Inicio</label>
                        <input type="time" id="classTime" class="form-control" value="17:30">
                    </div>
                    <div class="form-group">
                        <label>Fin</label>
                        <input type="time" id="classEndTime" class="form-control" value="20:30">
                    </div>
                </div>
                
                <button id="btnSaveClass" onclick="processClass()" class="btn-primary">
                    <i class="fa-regular fa-calendar-plus"></i> Guardar y Crear Alarma
                </button>
            </div>

            <div class="card">
                <div class="card-title" style="color: #f8fafc;"><i class="fa-solid fa-layer-group" style="color: #38bdf8;"></i> Mi Agenda Semanal</div>
                <div id="classesList"></div>
            </div>
        </div>

        <!-- =================== SECCIÓN DE TAREAS =================== -->
        <div id="vista-tareas" style="display: none;">
            <div class="card">
                <div class="card-title" style="color: #a78bfa;"><i class="fa-solid fa-list-check"></i> Nueva Tarea</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Actividad a realizar</label>
                        <input type="text" id="taskName" class="form-control" placeholder="Ej. Ensayo Cap. 3">
                    </div>
                    <div class="form-group">
                        <label>Asignatura</label>
                        <select id="taskSubject" class="form-control"></select>
                    </div>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Fecha de entrega</label>
                        <input type="date" id="taskDate" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Hora límite</label>
                        <input type="time" id="taskTime" class="form-control" value="23:59">
                    </div>
                </div>
                <button id="btnSaveTask" onclick="processTask()" class="btn-primary btn-secondary">
                    <i class="fa-solid fa-plus"></i> Guardar Actividad
                </button>
            </div>
            
            <div class="card">
                <div class="card-title" style="color: #f8fafc;"><i class="fa-solid fa-inbox" style="color: #a78bfa;"></i> Bandeja de Pendientes</div>
                <div id="tasksList"></div>
            </div>
        </div>

        <!-- =================== SECCIÓN DE AUDIO / TRANSCRIPCIÓN (GROQ IA) =================== -->
        <div id="vista-audio" style="display: none;">
            <div class="card">
                <div class="card-title" style="color: var(--ai-color);"><i class="fa-solid fa-microphone-lines"></i> Resumen de Clase por IA</div>
                
                <div class="form-group" style="margin-bottom: 16px;">
                    <label>Selecciona la materia</label>
                    <select id="audioSubject" class="form-control"></select>
                </div>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label>Archivo de audio o video (Máx 25 MB)</label>
                    <label class="custom-file-upload" style="border-style: solid; justify-content: center;">
                        <i class="fa-solid fa-cloud-arrow-up" style="font-size: 1.2rem;"></i>
                        <span id="audioFileName">Buscar archivo de clase...</span>
                        <input type="file" id="classAudioFile" accept="audio/*,video/*" onchange="actualizarNombreAudio(this)">
                    </label>
                </div>
                
                <!-- LLAVE PRE-CARGADA DE GROQ -->
                <div class="form-group" style="margin-bottom: 16px;">
                    <label>Tu Llave de IA (Groq API Key)</label>
                    <input type="password" id="inputApiKey" class="form-control" value="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" placeholder="Pega aquí tu clave gsk_..." oninput="guardarLlaveLocal(this.value)">
                </div>

                <button id="btnProcesarIA" onclick="procesarAudioConIA()" class="btn-primary btn-ai">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Analizar Clase con Groq IA
                </button>
            </div>

            <div class="card" id="resultadoTranscripcionCard" style="display: none;">
                <div class="card-title" style="color: var(--ai-color);"><i class="fa-solid fa-file-lines"></i> Notas Inteligentes</div>
                <div id="textoResumenIA" style="font-size: 0.95rem; color: var(--text-main); line-height: 1.6; white-space: pre-line;"></div>
            </div>
        </div>

    </div>

    <!-- SDK DE FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <script>
        // --- INICIALIZACIÓN DE FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyChimhVHezYOA6go-06XLlp96pJMX-mcI0",
            authDomain: "control-de-clases-y-tareas.firebaseapp.com",
            projectId: "control-de-clases-y-tareas",
            storageBucket: "control-de-clases-y-tareas.firebasestorage.app",
            messagingSenderId: "624724290598",
            appId: "1:624724290598:web:cb282d508b9250d9c4cae7"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        let currentUser = null;
        let unsubscribeClasses = null;
        let unsubscribeTasks = null;
        let editingClassId = null;
        let editingTaskId = null;

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('groq_saved_key');
            if (savedKey) {
                document.getElementById('inputApiKey').value = savedKey;
            } else {
                guardarLlaveLocal(document.getElementById('inputApiKey').value);
            }
        });

        function guardarLlaveLocal(valor) {
            localStorage.setItem('groq_saved_key', valor.trim());
        }

        function toggleMenu() { document.getElementById('dropdownMenu').classList.toggle('active'); }
        window.onclick = function(event) { if (!event.target.closest('.menu-container')) document.getElementById('dropdownMenu').classList.remove('active'); }

        function cambiarVista(vista) {
            document.getElementById('dropdownMenu').classList.remove('active');
            document.getElementById('menu-clases').classList.remove('active-item');
            document.getElementById('menu-tareas').classList.remove('active-item');
            document.getElementById('menu-audio').classList.remove('active-item');
            document.getElementById(`menu-${vista}`).classList.add('active-item');

            document.getElementById('vista-clases').style.display = (vista === 'clases') ? 'block' : 'none';
            document.getElementById('vista-tareas').style.display = (vista === 'tareas') ? 'block' : 'none';
            document.getElementById('vista-audio').style.display = (vista === 'audio') ? 'block' : 'none';

            const titulos = { 'clases': 'Agenda de Clases', 'tareas': 'Mis Tareas', 'audio': 'Transcripción IA' };
            document.getElementById('vistaActualTexto').textContent = titulos[vista];
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('dashboard-view').style.display = 'flex';
                document.getElementById('userName').textContent = user.displayName;
                document.getElementById('profileAvatar').innerHTML = `<img src="${user.photoURL}" alt="Perfil">`;
                loadUserData();
            } else {
                currentUser = null;
                document.getElementById('dashboard-view').style.display = 'none';
                document.getElementById('login-view').style.display = 'flex';
                if(unsubscribeClasses) unsubscribeClasses();
                if(unsubscribeTasks) unsubscribeTasks();
            }
        });
        
        function loginWithGoogle() { auth.signInWithPopup(provider).catch(error => console.error(error)); }
        function logout() { auth.signOut(); }

        document.getElementById('classImage').addEventListener('change', function(e) {
            document.getElementById('fileNameDisplay').textContent = e.target.files[0] ? e.target.files[0].name : "Adjuntar imagen...";
        });

        function actualizarNombreAudio(input) {
            document.getElementById('audioFileName').textContent = input.files[0] ? input.files[0].name : "Buscar archivo de clase...";
        }

        const daysMapStr = { "1": "Lunes", "2": "Martes", "3": "Miércoles", "4": "Jueves", "5": "Viernes", "6": "Sábado", "7": "Domingo" };
        let classes = [];
        let tasks = [];

        function loadUserData() {
            unsubscribeClasses = db.collection("clases").where("userId", "==", currentUser.uid).onSnapshot((snapshot) => {
                classes = []; snapshot.forEach((doc) => { classes.push({ id: doc.id, ...doc.data() }); }); renderClasses();
            });
            unsubscribeTasks = db.collection("tareas").where("userId", "==", currentUser.uid).onSnapshot((snapshot) => {
                tasks = []; snapshot.forEach((doc) => { tasks.push({ id: doc.id, ...doc.data() }); }); renderTasks();
            });
        }

        function renderClasses() {
            const list = document.getElementById('classesList');
            list.innerHTML = '';
            updateSubjectDropdowns(); 
            if(classes.length === 0) {
                list.innerHTML = `<div class="empty-state"><i class="fa-regular fa-calendar-xmark"></i><p>No tienes clases registradas.</p></div>`;
                return;
            }
            classes.sort((a, b) => a.day - b.day || a.time.localeCompare(b.time));
            classes.forEach((cls) => {
                const imageHTML = cls.img ? `<img src="${cls.img}" alt="Clase">` : `<i class="fa-solid fa-book"></i>`;
                list.innerHTML += `
                    <div class="list-item">
                        <div class="item-img-box">${imageHTML}</div>
                        <div class="item-info">
                            <h3>${cls.name}</h3><p><i class="fa-regular fa-clock" style="color:var(--primary);"></i> ${daysMapStr[cls.day]} • ${cls.time} - ${cls.endTime}</p>
                        </div>
                        <div class="actions">
                            <a href="${cls.link}" target="_blank" class="btn-icon play"><i class="fa-solid fa-play"></i></a>
                            <button class="btn-icon edit" onclick="editClass('${cls.id}')"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-icon delete" onclick="deleteClass('${cls.id}')"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>`;
            });
        }

        function updateSubjectDropdowns() {
            const selectTask = document.getElementById('taskSubject');
            const selectAudio = document.getElementById('audioSubject');
            selectTask.innerHTML = selectAudio.innerHTML = '';
            if(classes.length === 0) {
                selectTask.innerHTML = selectAudio.innerHTML = '<option value="" disabled selected>Registra una clase primero...</option>';
            } else {
                selectTask.innerHTML = selectAudio.innerHTML = '<option value="" disabled selected>Selecciona tu asignatura...</option>';
                classes.forEach(cls => { 
                    selectTask.innerHTML += `<option value="${cls.name}">${cls.name}</option>`; 
                    selectAudio.innerHTML += `<option value="${cls.name}">${cls.name}</option>`; 
                });
            }
        }

        function processClass() {
            const name = document.getElementById('className').value.trim();
            const link = document.getElementById('classLink').value.trim();
            const day = document.getElementById('classDay').value;
            const time = document.getElementById('classTime').value;
            const endTime = document.getElementById('classEndTime').value;
            const fileInput = document.getElementById('classImage');
            
            if(!name || !link || !time || !endTime) return alert('Completa los datos.');

            if (editingClassId) {
                let updateData = { name, link, day, time, endTime };
                if(fileInput.files.length > 0) {
                    const reader = new FileReader();
                    reader.onload = function(e) { updateData.img = e.target.result; db.collection("clases").doc(editingClassId).update(updateData).then(resetClassForm); };
                    reader.readAsDataURL(fileInput.files[0]);
                } else {
                    db.collection("clases").doc(editingClassId).update(updateData).then(resetClassForm);
                }
            } else {
                if(fileInput.files.length > 0) {
                    const reader = new FileReader();
                    reader.onload = function(e) { saveAndCreateAlarm(name, link, day, time, endTime, e.target.result); };
                    reader.readAsDataURL(fileInput.files[0]);
                } else {
                    saveAndCreateAlarm(name, link, day, time, endTime, null);
                }
            }
        }

        function saveAndCreateAlarm(name, link, day, time, endTime, imgBase64) {
            db.collection("clases").add({ userId: currentUser.uid, name, link, day, time, endTime, img: imgBase64 });
            const parsedDay = parseInt(day);
            const gcalDays = {1: "MO", 2: "TU", 3: "WE", 4: "TH", 5: "FR", 6: "SA", 7: "SU"};
            let date = new Date(); let distance = parsedDay - date.getDay(); if (distance < 0) distance += 7; date.setDate(date.getDate() + distance);
            const pad = n => String(n).padStart(2, '0');
            let [startHours, startMinutes] = time.split(':'); let dateString = `${date.getFullYear()}${pad(date.getMonth()+1)}${pad(date.getDate())}T${pad(startHours)}${pad(startMinutes)}00`;
            let [endHours, endMinutes] = endTime.split(':'); let endDate = new Date(date); endDate.setHours(parseInt(endHours), parseInt(endMinutes)); let endString = `${endDate.getFullYear()}${pad(endDate.getMonth()+1)}${pad(endDate.getDate())}T${pad(endHours)}${pad(endMinutes)}00`;
            const calendarUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(name)}&dates=${dateString}/${endString}&details=${encodeURIComponent("Enlace: " + link)}&recur=RRULE:FREQ=WEEKLY;BYDAY=${gcalDays[parsedDay]}`;
            resetClassForm(); window.open(calendarUrl, '_blank');
        }

        function editClass(id) {
            const cls = classes.find(c => c.id === id); if(!cls) return;
            document.getElementById('className').value = cls.name; document.getElementById('classLink').value = cls.link;
            document.getElementById('classDay').value = cls.day; document.getElementById('classTime').value = cls.time; document.getElementById('classEndTime').value = cls.endTime;
            editingClassId = id; document.getElementById('btnSaveClass').innerHTML = '<i class="fa-solid fa-save"></i> Guardar Cambios'; window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetClassForm() {
            editingClassId = null; document.getElementById('className').value = ''; document.getElementById('classLink').value = ''; document.getElementById('classImage').value = ''; 
            document.getElementById('fileNameDisplay').textContent = 'Adjuntar imagen...'; document.getElementById('btnSaveClass').innerHTML = '<i class="fa-regular fa-calendar-plus"></i> Guardar y Crear Alarma';
        }

        function deleteClass(firebaseId) { if(confirm("¿Eliminar clase?")) db.collection("clases").doc(firebaseId).delete(); }

        // --- SISTEMA DE TAREAS CON CONTADOR DE TIEMPO INTELIGENTE ---
        function renderTasks() {
            const list = document.getElementById('tasksList'); list.innerHTML = '';
            if(tasks.length === 0) { list.innerHTML = `<div class="empty-state"><i class="fa-solid fa-mug-hot" style="font-size: 2rem;"></i><p>No tienes tareas pendientes.</p></div>`; return; }
            
            tasks.sort((a, b) => new Date(a.date + 'T' + a.time) - new Date(b.date + 'T' + b.time));
            
            tasks.forEach((tsk) => {
                const dueDate = new Date(tsk.date + 'T' + tsk.time); 
                const now = new Date(); 
                const diffMs = dueDate - now;
                const isUrgent = diffMs > 0 && diffMs < (24 * 60 * 60 * 1000); 
                const urgentClass = isUrgent ? 'urgent' : '';
                const dateStr = new Date(tsk.date + 'T12:00:00').toLocaleDateString('es-ES', { month: 'short', day: 'numeric' });
                
                const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                const diffHours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                
                let tiempoRestanteHTML = "";
                if (diffMs < 0) {
                    tiempoRestanteHTML = `<span class="task-tag" style="background: rgba(239, 68, 68, 0.15); color: #fca5a5; border-color: rgba(239, 68, 68, 0.3);"><i class="fa-solid fa-circle-exclamation"></i> Vencida</span>`;
                } else if (diffDays > 0) {
                    tiempoRestanteHTML = `<span class="task-tag" style="background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border-color: rgba(16, 185, 129, 0.3);"><i class="fa-regular fa-clock"></i> Faltan ${diffDays} día${diffDays > 1 ? 's' : ''}</span>`;
                } else if (diffHours > 0) {
                    tiempoRestanteHTML = `<span class="task-tag" style="background: rgba(245, 158, 11, 0.15); color: #fcd34d; border-color: rgba(245, 158, 11, 0.3);"><i class="fa-solid fa-stopwatch"></i> Faltan ${diffHours} hora${diffHours > 1 ? 's' : ''}</span>`;
                } else {
                    tiempoRestanteHTML = `<span class="task-tag" style="background: rgba(239, 68, 68, 0.15); color: #fca5a5; border-color: rgba(239, 68, 68, 0.3);"><i class="fa-solid fa-fire"></i> ¡Vence pronto!</span>`;
                }

                list.innerHTML += `
                    <div class="list-item task-item ${urgentClass}" id="task-${tsk.id}">
                        <div class="item-info">
                            <h3>${tsk.name}</h3>
                            <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px;">
                                <span class="task-tag"><i class="fa-solid fa-bookmark"></i> ${tsk.subject}</span>
                                ${tiempoRestanteHTML}
                            </div>
                            <p style="margin-top: 6px; color: ${isUrgent ? '#ef4444' : '#94a3b8'};">
                                <i class="fa-regular fa-calendar-xmark"></i> Límite: ${dateStr} - ${tsk.time}
                            </p>
                        </div>
                        <div class="actions" style="flex-direction: column;">
                            <button class="btn-icon success" onclick="completeTask('${tsk.id}')"><i class="fa-solid fa-check"></i></button>
                            <button class="btn-icon edit" onclick="editTask('${tsk.id}')"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-icon delete" onclick="deleteTask('${tsk.id}')"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>`;
            });
        }

        function processTask() {
            const name = document.getElementById('taskName').value.trim(); const subject = document.getElementById('taskSubject').value; const date = document.getElementById('taskDate').value; const time = document.getElementById('taskTime').value;
            if(!name || !subject || !date || !time) return alert('Faltan datos obligatorios para la tarea.');
            if (editingTaskId) { db.collection("tareas").doc(editingTaskId).update({ name, subject, date, time }).then(resetTaskForm); } 
            else { db.collection("tareas").add({ userId: currentUser.uid, name, subject, date, time }).then(resetTaskForm); }
        }

        function editTask(id) {
            const tsk = tasks.find(t => t.id === id); if(!tsk) return;
            document.getElementById('taskName').value = tsk.name; document.getElementById('taskSubject').value = tsk.subject; document.getElementById('taskDate').value = tsk.date; document.getElementById('taskTime').value = tsk.time;
            editingTaskId = id; document.getElementById('btnSaveTask').innerHTML = '<i class="fa-solid fa-save"></i> Guardar Cambios'; window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetTaskForm() { editingTaskId = null; document.getElementById('taskName').value = ''; document.getElementById('taskSubject').value = ''; document.getElementById('taskDate').value = ''; document.getElementById('btnSaveTask').innerHTML = '<i class="fa-solid fa-plus"></i> Guardar Actividad'; }
        function completeTask(firebaseId) { const el = document.getElementById(`task-${firebaseId}`); if (el) el.classList.add('completing'); setTimeout(() => { db.collection("tareas").doc(firebaseId).delete(); }, 300); }
        function deleteTask(firebaseId) { if(confirm("¿Eliminar esta tarea?")) db.collection("tareas").doc(firebaseId).delete(); }


        // ==========================================================
        // 🔥 LÓGICA DE IA (GROQ) CON MODELOS ACTUALIZADOS Y ACTIVOS
        // ==========================================================
        async function procesarAudioConIA() {
            const materia = document.getElementById('audioSubject').value;
            const archivoInput = document.getElementById('classAudioFile');
            const archivo = archivoInput.files[0];
            
            const GROQ_API_KEY = document.getElementById('inputApiKey').value.trim();

            if(!materia) return alert('Por favor selecciona una materia primero.');
            if(!archivo) return alert('Por favor selecciona un archivo de audio o video para la IA.');
            if(!GROQ_API_KEY) return alert('La API Key de Groq no se encuentra.');

            if (archivo.size > 25 * 1024 * 1024) {
                return alert('El archivo pesa más de 25 MB. Por favor, recórtalo o comprímelo antes de subirlo.');
            }

            const tarjetaResultado = document.getElementById('resultadoTranscripcionCard');
            const textoResultado = document.getElementById('textoResumenIA');
            const btn = document.getElementById('btnProcesarIA');
            
            tarjetaResultado.style.display = 'block';
            btn.disabled = true;
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

            try {
                // PASO 1: Transcribir el audio usando Whisper-Large-v3-Turbo en Groq
                textoResultado.innerHTML = `⏳ <b>Paso 1/2:</b> Transcribiendo audio de la clase velozmente...`;
                
                const formData = new FormData();
                formData.append("file", archivo);
                formData.append("model", "whisper-large-v3-turbo");
                formData.append("response_format", "json");
                formData.append("language", "es"); 

                const transcripcionRes = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${GROQ_API_KEY}` },
                    body: formData
                });

                const transcripcionData = await transcripcionRes.json();
                
                if (!transcripcionRes.ok || transcripcionData.error) {
                    throw new Error(transcripcionData.error?.message || "Error al transcribir el audio.");
                }

                const textoTranscrito = transcripcionData.text;

                if (!textoTranscrito || textoTranscrito.trim() === "") {
                    throw new Error("No se logró detectar ninguna voz humana en este archivo.");
                }

                // PASO 2: Resumir el texto usando una lista de modelos gratuitos 100% activos hoy en día
                const modelosDeRespaldo = [
                    "llama-3.1-8b-instant",
                    "gemma2-9b-it",
                    "llama3-8b-8192"
                ];

                let exitoChat = false;
                let respuestaFinal = "";
                
                const promptInteligente = `Actúa como el mejor estudiante universitario. Lee esta transcripción de una clase de '${materia}'. Haz un resumen súper detallado con los puntos clave y temas importantes. Al final del resumen, crea una sección que diga 'TAREAS PENDIENTES:' y enlista de forma clara todas las tareas, ensayos o investigaciones que el profesor asignó. Si no dejó tarea, escribe 'No se asignaron tareas en esta sesión'.

Transcripción de la clase:
"${textoTranscrito}"`;

                for (let i = 0; i < modelosDeRespaldo.length; i++) {
                    let modeloActual = modelosDeRespaldo[i];
                    textoResultado.innerHTML = `⏳ <b>Paso 2/2:</b> Generando resumen (Probando modelo ${modeloActual})...`;

                    try {
                        const chatRes = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${GROQ_API_KEY}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                model: modeloActual,
                                messages: [{ role: "user", content: promptInteligente }]
                            })
                        });

                        const chatData = await chatRes.json();

                        if (chatData.error) {
                            throw new Error(chatData.error.message);
                        }

                        respuestaFinal = chatData.choices[0].message.content;
                        exitoChat = true;
                        break; // Si el modelo responde correctamente, salimos del bucle

                    } catch (error) {
                        console.warn(`Modelo ${modeloActual} no disponible:`, error.message);
                        if (i === modelosDeRespaldo.length - 1) {
                            throw new Error("Todos los modelos gratuitos fallaron. El último error fue: " + error.message);
                        }
                    }
                }

                if (exitoChat) {
                    textoResultado.innerHTML = `<b>Resumen Inteligente de ${materia}</b><br><br>${respuestaFinal.replace(/\n/g, '<br>')}`;
                    archivoInput.value = '';
                    document.getElementById('audioFileName').textContent = 'Buscar archivo de clase...';
                }

            } catch (error) {
                console.error("Error en Groq API:", error);
                textoResultado.innerHTML = `<span style="color:var(--danger)"><i class="fa-solid fa-triangle-exclamation"></i> Error: ${error.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> Analizar otra clase con Groq IA`;
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(err => console.log('Fallo PWA:', err)); });
        }
    </script>
